# ============================================================
# 生效股票池(pool.yaml)— A股投资准则 v2.0 P3/P4
#
# 生成流程:
#   1) python main.py pool     -> P1 硬条件自动筛,产出 data/pool_candidates.csv
#   2) 人工逐只 P2 判断(一句话说清靠什么赚钱/行业地位/不依赖单一客户)
#   3) 通过的写进本文件,填好理由卡(P4),value_dip 才会交易它
#   4) 每年 4月底/8月底/10月底(P6)重跑 pool 命令,移出不再满足硬条件的,
#      持仓股触发 G11 人工复核
#
# 注意:
# - 本文件为初稿模板,理由卡仅为示范,正式使用前必须自己过一遍 P2;
# - 只放沪深主板(60/00开头):1万元无北交所/科创板/创业板实盘权限,
#   引擎的市场闸门也会把无权限标的过滤掉;
# - 行业字段用于 G2 同行业上限(<=25%)与 P5 周期股 PB 估值切换。
# ============================================================

stocks:
  - symbol: SH600036
    name: 招商银行
    industry: 银行
    how_it_makes_money: 零售信贷与财富管理的手息差和中间业务收入
    thesis:
      - 零售银行标杆,负债成本行业最低
      - 财富管理转型带来中收增长
      - 分红率长期保持30%以上
    invalid_signals:
      - 不良率连续两年显著上升
      - 净息差跌破1.5%且无见底迹象
    max_wait_years: 2
  - symbol: SH600900
    name: 长江电力
    industry: 电力
    how_it_makes_money: 六座水电站发电卖电,成本固定,现金流像债券票息
    thesis:
      - 长江流域六库联调,来水长期稳定
      - 电价市场化后仍有提价空间
      - 承诺分红,类债属性压舱
    invalid_signals:
      - 来水连续两年大幅低于设计值
      - 电价政策转向大幅压价
    max_wait_years: 3
  - symbol: SH600309
    name: 万华化学
    industry: 化工
    how_it_makes_money: MDI 全球寡头垄断的价差,叠加石化一体化利润
    thesis:
      - MDI 全球三家垄断,技术壁垒极高
      - 福建/匈牙利基地扩张带来量增
      - 周期底部现金流仍为正
    invalid_signals:
      - MDI 价差跌破历史极端低位且持续一年以上
      - 大额资本开支失控,负债率飙升
    max_wait_years: 2
  - symbol: SZ000333
    name: 美的集团
    industry: 家电
