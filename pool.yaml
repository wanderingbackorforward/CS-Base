    thesis:
      - 全球家电份额第一,T+3 供应链效率极高
      - 库卡机器人与楼宇科技第二曲线
      - 高分红+回购,治理规范
    invalid_signals:
      - 海外订单连续三个季度负增长
      - ToB 业务连续大幅减值
    max_wait_years: 2
  - symbol: SH600887
    name: 伊利股份
    industry: 食品饮料
    how_it_makes_money: 液态奶与奶粉的渠道+品牌溢价
    thesis:
      - 常温奶绝对龙头,渠道下沉到乡镇
      - 奶粉逆势份额提升,成人奶粉高增
      - 原奶价格见底利好毛利率
    invalid_signals:
      - 原奶价格长期双位数上涨而提价失败
