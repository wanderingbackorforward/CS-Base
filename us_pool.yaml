# ============================================================
# 美股卫星仓理由卡池(us_pool.yaml)— 美股投资准则 v1.1 S1-S7
#
# 入选标准(全部满足才能买,人工把关,系统只做字段校验):
#   S1 美国上市(含ADR),市值 >= 1000亿美元
#   S2 最近4个季度都盈利,自由现金流为正
#   S3 行业前三,或有清楚的护城河(技术/规模/生态)
#   S4 不是"单一事件定生死"的公司
#   S5 过去5年最大回撤不超过 70%(系统按日线自动复核)
#
# 字段说明:
#   symbol       统一 US 前缀,如 USTSM / USAMD
#   vol_class    normal=移动止盈回落25% / high=回落30%(S10,高波动个股)
#   industry     行业(R3:同行业合计 <= 15%;台积电/AMD/英伟达都是半导体)
#   next_earnings 下次财报日(YYYY-MM-DD,S7:公布前3个交易日不买,出财报后请人工更新)
#   thesis / invalid_signals / max_wait_years  理由卡(S7 必填,缺失不买)
#
# 注意:本文件为初稿模板,理由卡仅为示范,正式使用前必须自己过一遍 S1-S5;
# 最多 3 只(R4 由系统强制)。
# ============================================================

stocks:
  - symbol: USTSM
    name: 台积电ADR
    industry: 半导体
    vol_class: normal        # 2022年从高点跌约六成,S10 用 25% 回落线
    next_earnings: ""        # 待填:下次财报日(YYYY-MM-DD)
    how_it_makes_money: 全球最先进制程代工,按晶圆产能和良率收钱
    thesis:
      - 3nm/2nm 制程独占,先进制程份额 ~90%
      - 亚利桑那扩产打开地缘溢价,客户必须双供应链
      - AI 芯片(HPC)占营收过半,结构升级抬毛利
    invalid_signals:
      - 连续2个季度营收同比下滑
      - 先进制程良率失守,大客户转单
      - 毛利率跌破45%且无见底迹象
    max_wait_years: 2
  - symbol: USAMD
    name: 超威半导体
    industry: 半导体
    vol_class: high          # 2022年从高点跌约三分之二,S10 用 30% 回落线
    next_earnings: ""        # 待填:下次财报日(YYYY-MM-DD)
    how_it_makes_money: CPU/GPU/IP 授权与数据中心 AI 加速卡
    thesis:
      - x86 CPU 双寡头之一,服务器份额持续侵蚀英特尔
      - MI 系列 AI 卡是英伟达之外唯一的规模化选择
      - Chiplet 架构成本优势,毛利率中枢上移
    invalid_signals:
      - 连续2个季度营收同比下滑
      - 数据中心 GPU 份额停滞且大客户流失
      - 毛利率跌破45%且无见底迹象
    max_wait_years: 2
