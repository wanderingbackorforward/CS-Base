# =====================================================================
# 投资系统准则 v5.1(2026-10-20 第二次严审后)
# 2026-10-20 · @pk cabble —— 双账户唯一规则来源,系统只算信号/推送,不碰账户密码
#
# 三层结构(v3 交易层 E1-E7 与大底储备 Z1-Z4 全部废除):
#   核心 C1-C3   美股40%(只买一只标普500 ETF) / A股55%(红利低波25%+A500 30%)
#   进攻仓 H1-H10 美股50%(3-5只,单只目标12.5%) / A股30%(3只左右,单只目标10%)
#   储备        美股10%(短债ETF) / A股15%(货基),只通过 C2 再平衡带买指数
#   名人名单 P1-P5 只提供候选线索;买不买由 H2 硬条件 + H3 论点卡 + 均线/估值决定
#   重仓赢家(H9 不止盈),早走输家(H7 论点卡/H8 均线);个股永不摊平(H6)
#
# 纪律 D1:参数只在季度调仓日改,写原因,下季度生效;D3:规则总数只减不增。
# 本文不构成投资建议。
# =====================================================================
version: "5.1"

dashboard:
  host: 0.0.0.0
  port: 8501
  password: "y318760nj"      # 看板登录密码(R7:系统不接触账户密码)
  token_hours: 12

datafeed:
  cache_dir: ./data/cache
  max_retries: 3

# ---------------------------------------------------------------------
# A股账户:核心55 / 进攻30 / 储备15(=100%)
# ---------------------------------------------------------------------
allocation:
  core_pct: 0.55
  attack_pct: 0.30
  reserve_pct: 0.15
  rebalance_drift: 0.05      # C2 再平衡带 5 个百分点
  new_money_us_ratio: 0.70   # 新钱默认 美股7:A股3;两账户之间不搬钱
  quarter_day_mode: quarter_start   # A股季度调仓日 = 每季度首个交易日(美股走13F截止日)

# 核心层 C1-C3:一直持有,只做再平衡;不止盈、不择时
core:
  etfs:
    - {symbol: SH512890, name: 红利低波ETF, target_pct: 0.25}
    - {symbol: SH512050, name: 中证A500ETF, target_pct: 0.30}   # 或沪深300ETF(SH510300),二选一
  dca_months: 3              # C1 首次建仓:分3个月、每月等额买完
  park_symbol: SH511990      # 储蓄停泊:货币基金,不挪作他用
  park_min_amount: 10000     # 场内货基最小1手(100份×~100元)
  sweep_buffer: 0.02         # C3 新钱先留现金;闲置现金超2%即扫入停泊

# 进攻仓 H1-H10:重仓少数好公司(美股狠,A股小——T+1/涨跌停/减持风险)
attack:
  pool_file: ./pool.yaml         # A股候选池(U2/U3 硬筛 + 来源标注)
  persons_file: ./persons_cn.yaml
  thesis_file: ./thesis_cards.yaml
  min_names: 3                   # H4 3只左右(账户小时按 R3 可以更少)
  max_names: 5
  target_pct: 0.30
  per_name_max: 0.10             # H4 单只 ≤ 账户10%;放不满的钱留在核心
  per_name_trim_at: 0.15          # H9 超过15%时在季度调仓日减回
  per_name_trim_to: 0.12
  total_trim_at: 0.70             # H9 进攻仓整体
  total_trim_to: 0.60
  max_total_target: 0.60          # H9 进攻仓目标比例最高可调到60%(想更狠先调这个)
  entry_mode: valuation           # H5 第一步:A股用估值分位(美股用10个月均线)
  entry_val_max: 0.50             #    估值分位 ≤ 50% 才买半仓(近5年PE,周期股用PB)
  exit_val_max: 0.90              # H7 A股估值分位 > 90% 卖出剩余全部
  use_ma: false                   # A股先不用 H8,由回测决定
  ma_months: 10
  h8_profit_kept: 0.30            # (美股)浮盈≥30%先卖一半——税
  h8_streak_months: 3             # (美股)连续3个月末在均线下再卖另一半
  source_gone_quarters: 2         # P4 来源消失满2个季度 -> H7
  isolation_line: 0.50            # H10 进攻市值 < 累计投入的一半 -> 隔离
  isolation_months: 12            #    12个月内新钱不进进攻仓,核心永不补亏
  min_order_amount: 1000          # R3 每笔佣金≤成交额0.5%(A股最低5元 -> ≥1000元)
  industry_cap: 0.20              # R2 A股同行业 ≤ 账户20%(美股40%)
  lookthrough_cap: 0.30            # R1 直接+指数ETF穿透 ≤ 账户30%
  index_weights_file: ./index_weights_cn.yaml   # R1 ETF穿透权重(基金公司官网日持仓,手更)
  hard_profiles: [U2, U3]          # H2 A股硬条件沿用 v3 U2(老登)/U3(科技)

# A股候选池 U2/U3 硬筛(财报可查,系统自动筛;4/8/10月底重筛)
pool:
  file: ./pool.yaml
  spot_top_n: 380                 # 先按成交额取前N只进入硬筛
  max_stocks: 25                  # U4 股票池保持15~25只
  min_stocks: 15
  re_screen_months: [4, 8, 10]    # 定期报告出齐后重筛
  min_list_years: 3
  min_market_cap: 300             # 亿元
  min_amount: 1.0                 # 日均成交额 亿元
  profiles:
    old:                          # U2 老登股(银行/非银/食饮/公用/交运/石油石化/煤炭/家电)
      industries: [银行, 非银金融, 食品饮料, 公用事业, 交通运输, 石油石化, 煤炭, 家用电器]
      roe_min_3y: 0.10            # 近3年每年ROE≥10%
      dividend_years_3y: true     # 近3年每年现金分红
      div_yield_min: 0.03         # 股息率≥3%
      debt_max: 0.60              # 资产负债率≤60%(金融除外)
      no_loss_3y: false
      revenue_growth_min: null
      rd_ratio_min: null
      ocf_profit_min: null
    tech:                          # U3 科技股(电子/计算机/通信/传媒/电力设备/国防军工)
      industries: [电子, 计算机, 通信, 传媒, 电力设备, 国防军工]
      roe_min_3y: 0.08
      dividend_years_3y: false
      div_yield_min: null
      debt_max: null
      no_loss_3y: true            # 近3年没有亏损
      revenue_growth_min: 0.15     # 营收年均增长≥15%
      rd_ratio_min: 0.05          # 研发投入≥营收5%
      ocf_profit_min: 0.80        # 经营现金流合计≥净利润合计80%
  pledge_max: 0.30                 # 控股股东质押≤30%(人工核对,系统记录)
  audit_std_required: true        # 审计意见标准无保留
  no_investigation_3y: true        # 近3年没被立案调查

# A股估值分位(H5/H7 闸门;近5年PE,周期行业用PB)
valuation:
  window_years: 5
  cyclic_industries: [银行, 非银金融, 钢铁, 化工, 有色金属, 保险, 煤炭, 石油石化, 交通运输]
  max_stale_days: 45

schedule:
  mode: asia_shanghai
  mark_times: ["10:30", "14:00"]   # 盘中仅记净值,不产生交易决策
  signal_time: "15:10"            # 收盘后算信号(H5第一步/H8在月末,其余每天查H7)
  execute_time: "09:25"           # 次日开盘撮合
  eod_time: "15:35"

broker:
  paper:
    commission_rate: 0.00025      # 佣金万2.5
    commission_min: 5.0           # 最低5元(R3:每笔≥1000元)
    stamp_tax: 0.0005             # 印花税0.05%(卖出,2023年8月起减半;ETF不收)
    transfer_fee: 0.00001
    slippage: 0.001
    initial_cash: 10000           # 模拟起步;真实金额用 fill calibrate 校准

# 风控:v5 不再限制单只有多大(R1穿透/R2行业在进攻仓算),这里只留仓位通道
risk:
  max_position_pct: 0.30          # 通道值;真正的单只上限=H4/H9/R1
  max_total_exposure: 1.0
  regime_enabled: false
  daily_loss_limit_pct: -1.0      # 关闭(v5 无单日冷却;H10 管行为)
  cooldown_days: 0
  max_drawdown_kill: -1.0         # 关闭清仓熔断(v5 无此条)

fill:
  max_backfill_days: 5            # 人工通道回填时限
  allow_future_price: false

# ---------------------------------------------------------------------
# 美股账户(独立美元账户):核心40 / 进攻50 / 储备10(=100%)
# ---------------------------------------------------------------------
us:
  enabled: true
  data_dir: ./data_us
  account:
    currency: USD
    initial_cash: 10000
    max_transfer_out: 0.0
  allocation:
    core_pct: 0.40
    attack_pct: 0.50
    reserve_pct: 0.10
    rebalance_drift: 0.05
    new_money_ratio: 0.70         # 新钱默认美股:美股7:A股3的另一端
  core:
    etfs:
      - {symbol: USVOO, name: 标普500ETF(VOO/IVV/SPYM选一只), target_pct: 0.40}
    dca_months: 3                 # C1 分3个月买完
    park_symbol: USSGOV           # 储备停泊:短期美债ETF
    park_min_amount: 0            # 美股零股可买,无最小金额
    sweep_buffer: 0.02
  attack:
    pool_file: ./us_pool.yaml     # 美股候选(来源:投资人13F/掌舵人)
    persons_file: ./persons.yaml
    thesis_file: ./thesis_cards.yaml
    min_names: 3
    max_names: 5
    target_pct: 0.50
    per_name_target: 0.125       # 4只×12.5%=50%
    per_name_max: 0.20            # H4 单只≤20%
    per_name_trim_at: 0.25        # H9 超过账户25%减回20%
    per_name_trim_to: 0.20
    total_trim_at: 0.70
    total_trim_to: 0.60
    max_total_target: 0.60
    entry_mode: ma                 # H5 第一步:美股月末收盘 > 10个月均线
    use_ma: true
    ma_months: 10
    h8_profit_kept: 0.30           # H8 浮盈<30%全卖;≥30%先卖一半
    h8_streak_months: 3
    source_gone_quarters: 2
    isolation_line: 0.50
    isolation_months: 12
    min_order_amount: 3600         # R3 汇丰每单18美元 -> 每笔≥3600;两步 -> 单只目标≥7200
    industry_cap: 0.40              # R2 美股同行业 ≤ 40%
    lookthrough_cap: 0.30
    index_weights_file: ./index_weights_us.yaml
    hard:                          # H2 美股硬条件(不看自由现金流,免误杀大举投资的公司)
      min_mcap_usd: 10.0e9         # 市值 ≥ 100亿美元(含ADR)
      profit_4q: positive          # 近4个季度累计净利润为正
      ocf_4q: positive             # 近4个季度累计经营现金流为正
      max_financial_age_days: 200  # 财务字段超过200天未更新 -> 阻止新买入并推送
  quarter_day_mode: filing13f      # 季度调仓日 = 13F截止日的下一个交易日(2026-11-17)
  schedule:
    mode: us_eastern
    signal_time: "06:10"           # 北京时间收盘后算信号
    execute_time: "22:40"          # 北京时间开盘撮合(当晚挂限价单即可,不必守盘 R7)
    mark_times: ["23:30", "03:00"]
    eod_time: "06:35"
  broker:
    paper:
      commission_rate: 0.0001      # “交易荟”按交易额,低至0.01%
      commission_min: 18.0        # 汇丰标准佣金每单18美元
      slippage: 0.001
      stamp_tax: 0.0
  api:                            # Alpaca 直连(可选;留空走环境变量)
    enabled: false
    endpoint: "https://api.alpaca.markets"
    key_id: ""                    # 环境变量 ALPACA_KEY_ID
    secret: ""                    # 环境变量 ALPACA_SECRET
    order_timeout_sec: 8          # 超时绝不自动补单,转人工
